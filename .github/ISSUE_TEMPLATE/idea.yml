name: Idee / nächster Schnitt
description: Feature oder Spec-Lücke, kein Bug.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Gegen [docs/README.md](https://github.com/schroepa/comunio-skrt/blob/main/docs/README.md) prüfen, ob die Spec das schon entscheidet.
  - type: textarea
    id: why
    attributes:
      label: Warum
      description: Welchen Comunio-Fehler oder welche Entscheidung soll das vermeiden?
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec
      description: Existierende Datei unter docs/ oder „neue Spec nötig“.
